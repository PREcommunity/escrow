name: CI

on:
  push:
    branches: [main, 'codex/keyword-market-mainnet-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:sol
      - run: pnpm test
      - name: Upload Keyword Market gas measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-market-gas-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/keyword-market-gas.json
          if-no-files-found: warn
      - run: pnpm coverage
      - run: pnpm audit --audit-level high
